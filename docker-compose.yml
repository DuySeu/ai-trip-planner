services:
  # Local Postgres, configured from the DB_* values in .env
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
      # Builtin provider gives Unicode case mapping (lower('Đ') = 'đ') on Alpine's musl libc
      POSTGRES_INITDB_ARGS: "--locale-provider=builtin --builtin-locale=C.UTF-8"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # HTTP API; applies migrations first
  api:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    command: >
      sh -c "python scripts/migrate.py &&
             uvicorn api.main:app_factory --factory --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Background worker that runs plan jobs; migrate is idempotent and locked, so it is safe here too
  worker:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    command: sh -c "python scripts/migrate.py && python -m service.worker.worker"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
